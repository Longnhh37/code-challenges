name: Sync submissions into mono repo

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mono repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"

      - name: Add remotes
        env:
          NEETCODE_URL: https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/Longnhh37/neetcode-submissions.git
          CODEWARS_URL: https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/Longnhh37/codewars.git
        run: |
          git remote add neetcode-src "$NEETCODE_URL" || true
          git remote add codewars-src "$CODEWARS_URL" || true

      - name: Fetch and merge neetcode
        run: |
          git fetch neetcode-src main
          git merge neetcode-src/main --allow-unrelated-histories -m "chore: sync neetcode submissions" --no-edit || true

      - name: Fetch and merge codewars
        run: |
          git fetch codewars-src main
          git merge codewars-src/main --allow-unrelated-histories -m "chore: sync codewars submissions" --no-edit || true

      - name: Push if changed
        run: git push origin HEAD:main
