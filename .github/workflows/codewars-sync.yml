on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code-challenges
        uses: actions/checkout@v6
        with:
          path: code-challenges

      - name: Checkout Codewars
        uses: actions/checkout@v6
        with:
          repository: Longnhh37/codewars
          token: ${{ secrets.SYNC_PAT }}
          path: codewars

      - name: Sync
        run: |
          rm -rf code-challenges/codewars
          mkdir -p code-challenges/codewars
          rsync -a --exclude='.git' codewars/ code-challenges/codewars/

      - name: Commit and push
        working-directory: code-challenges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codewars
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "sync: daily submissions"
          git push
